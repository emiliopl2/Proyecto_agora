<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágora - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Ágora - Acceso</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500"
                    placeholder="admin@agora.com">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500"
                    placeholder="••••••••">
            </div>

            <div id="mensajeError" class="text-red-400 text-sm text-center hidden"></div>

            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-500 transition duration-200">
                Entrar
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('mensajeError');
            
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });

                const data = await response.json();

                if (data.exito) {
                    // Guardar datos básicos en la sesión del navegador y redirigir
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = data.mensaje;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión con el servidor.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
