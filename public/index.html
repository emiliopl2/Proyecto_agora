<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágora - Iniciar Sesión</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN (opcional: el diseño ya vive en css/agora.css) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/agora.css">
</head>
<body>

    <main class="login">

        <!-- Lado izquierdo: identidad (solo se ve en pantallas anchas) -->
        <section class="login-hero" aria-hidden="true">
            <img class="logo-grande" src="img/logo.png" alt="">
            <h2>Sistema de gestión de Ágora</h2>
            <p>Donadores, convocatorias y alianzas en un solo lugar.</p>
            <div class="puntos">
                <i style="background: var(--celeste-500)"></i>
                <i style="background: var(--violeta-500)"></i>
                <i style="background: var(--dorado-500)"></i>
                <i style="background: var(--rosa-500)"></i>
            </div>
        </section>

        <!-- Lado derecho: formulario -->
        <section class="login-form-lado">
            <div class="login-caja">
                <img class="login-logo-movil" src="img/logo.png" alt="Logo de Ágora A.C.">
                <h1>Ágora - Acceso</h1>
                <p class="sub">Ingresa con tu nombre de usuario.</p>

                <form id="loginForm">
                    <div class="campo">
                        <label for="usuario">Usuario</label>
                        <div class="con-icono">
                            <span data-icon="usuario"></span>
                            <input type="text" id="NombreCompleto" required autocomplete="username"
                                class="input" placeholder="Ingresa tu nombre de Usuario">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <div class="con-icono">
                            <span data-icon="lock"></span>
                            <input type="password" id="password" required autocomplete="current-password"
                                class="input" placeholder="••••••••">
                            <button type="button" class="btn-icono ver-pass" data-ver-password="password" aria-label="Mostrar contraseña">
                                <span data-icon="eye"></span>
                            </button>
                        </div>
                    </div>

                    <div id="mensajeError" class="mensaje-error hidden" role="alert"></div>

                    <button type="submit" class="btn btn-primario btn-bloque">Entrar</button>
                </form>
            </div>
        </section>

    </main>

    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
